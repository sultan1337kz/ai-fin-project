name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes only full semver tags (no floating major tag), so pin exactly.
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true

      # --locked fails the build if uv.lock is out of sync with pyproject.toml.
      # Python version is taken from .python-version.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Tests
        run: uv run pytest
